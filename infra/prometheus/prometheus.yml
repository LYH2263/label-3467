global:
  scrape_interval: 15s

scrape_configs:
  - job_name: spring-backends
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - backend-1:8080
          - backend-2:8080

  - job_name: gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - backend-1:8080
