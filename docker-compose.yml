services:
  db:
    image: mysql:8.0
    container_name: psyche3467-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: psyche_game
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "13467:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  redis:
    image: redis:7-alpine
    container_name: psyche3467-redis
    restart: unless-stopped
    ports:
      - "16467:6379"

  backend-1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: psyche3467-backend-1
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/psyche_game?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      APP_FRONTEND_URL: http://localhost:3467
      APP_UPLOAD_DIR: /app/uploads
      JWT_SECRET: PsycheGameJwtSecretForProdPleaseChangeThisToLongSecureString123456789
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/var/log/blog
    ports:
      - "8467:8080"

  backend-2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: psyche3467-backend-2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/psyche_game?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      APP_FRONTEND_URL: http://localhost:3467
      APP_UPLOAD_DIR: /app/uploads
      JWT_SECRET: PsycheGameJwtSecretForProdPleaseChangeThisToLongSecureString123456789
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/var/log/blog

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: psyche3467-frontend
    restart: unless-stopped

  gateway:
    image: nginx:alpine
    container_name: psyche3467-gateway
    restart: unless-stopped
    depends_on:
      - backend-1
      - backend-2
      - frontend
    ports:
      - "3467:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - logs_data:/var/log/blog

  prometheus:
    image: prom/prometheus:v2.53.1
    container_name: psyche3467-prometheus
    restart: unless-stopped
    depends_on:
      - backend-1
      - backend-2
    ports:
      - "39467:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  loki:
    image: grafana/loki:2.9.8
    container_name: psyche3467-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "33468:3100"
    volumes:
      - ./infra/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki

  promtail:
    image: grafana/promtail:2.9.8
    container_name: psyche3467-promtail
    restart: unless-stopped
    depends_on:
      - loki
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./infra/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - logs_data:/var/log/blog:ro
      - promtail_positions:/tmp

  grafana:
    image: grafana/grafana:11.1.4
    container_name: psyche3467-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
    ports:
      - "33467:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro

volumes:
  db_data:
  uploads_data:
  logs_data:
  prometheus_data:
  grafana_data:
  loki_data:
  promtail_positions:
